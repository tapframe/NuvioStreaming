name: Build iOS App

on:
  # push:
  #   branches: [ "release" ]
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build'
        required: true
        default: 'release'

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS release build
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NUVIO_IOS_DISTRIBUTION: appstore

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.build_branch || github.ref }}
        lfs: true
        submodules: false
        fetch-depth: 1

    - name: Clean stale submodule references and fetch
      run: |
        # Remove stale mpvKt submodule from git index and config
        git rm --cached mpvKt 2>/dev/null || true
        git config --file .gitmodules --remove-section submodule.mpvKt 2>/dev/null || true
        git config --file .git/config --remove-section submodule.mpvKt 2>/dev/null || true
        rm -rf .git/modules/mpvKt 2>/dev/null || true
        rm -rf mpvKt 2>/dev/null || true
        # Initialize and fetch submodules cleanly
        git submodule sync --recursive
        git submodule update --init --recursive --force

    # Uses maxim-lobanov/setup-xcode to reliably select the latest stable
    # Xcode rather than hardcoding a path. The project was created with Xcode
    # 16.2 (see project.pbxproj CreatedOnToolsVersion). latest-stable will
    # track forward automatically without breaking on runner image updates.
    - name: Select Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Cache Kotlin Native (Konan)
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Patch MPVKit for CI Prebuilts
      # The MPVKit submodule uses local xcframework paths that only exist on
      # developer machines. Swap them for the published release download URLs
      # so Xcode's SPM resolver can fetch them during the CI build.
      run: |
        set -euo pipefail
        cd MPVKit
        sed -i '' 's|path: "dist/release/xcframework/Libplacebo.xcframework"|url: "https://github.com/mpvkit/libplacebo-build/releases/download/7.351.0-2512/Libplacebo.xcframework.zip", checksum: "3b2bd57b82549566963effadf0891a141448d9f89c7d48fca0b8f823b854bac6"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libavcodec.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libavcodec.xcframework.zip", checksum: "6ccb6b5cf8fc05665f2ee4958f640b328755414946e9541adda40c536568ec43"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libavdevice.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libavdevice.xcframework.zip", checksum: "f571fbdef20e8d94ce6c8692eeee1fdff627e691cfcd2de5f9f294655c8cc405"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libavformat.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libavformat.xcframework.zip", checksum: "7ff0af2e5ee5a1f5d278caedb96a395c7c29f563f09cdf977b6670bc9724cb7d"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libavfilter.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libavfilter.xcframework.zip", checksum: "965d1271c37181b1fe23d34d0c7c1cb7626a080d5925d3bdb1d1f84afd7b3d7d"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libavutil.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libavutil.xcframework.zip", checksum: "7a8716f9ac793e2da895b9f87c37b56a9a2065f2c1f31b60f3d3589bea6c50a1"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libswresample.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libswresample.xcframework.zip", checksum: "7beb6e337b69882771c58281d42a449d8810e836e7ce07c6f91827267ab4fabd"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libswscale.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libswscale.xcframework.zip", checksum: "e9d660dc6eb27d20a25aa5659a966f07cf1a97ed9049ec19e8a06b3f2aec6b41"|g' Package.swift
        sed -i '' 's|path: "dist/release/xcframework/Libmpv.xcframework"|url: "https://github.com/mpvkit/MPVKit/releases/download/0.41.0/Libmpv.xcframework.zip", checksum: "9ff5077d675a1e12bec98db167a49f46eb57dba567f40558b7758d4f12fb3ae7"|g' Package.swift

    - name: Write runtime config to local.properties
      uses: ./.github/actions/write-runtime-config
      with:
        supabase-url: ${{ secrets.SUPABASE_URL }}
        supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
        nuvio-supabase-url: ${{ secrets.NUVIO_SUPABASE_URL }}
        nuvio-supabase-anon-key: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        trakt-client-id: ${{ secrets.TRAKT_CLIENT_ID }}
        trakt-client-secret: ${{ secrets.TRAKT_CLIENT_SECRET }}
        trakt-redirect-uri: ${{ secrets.TRAKT_REDIRECT_URI }}
        introdb-api-url: ${{ secrets.INTRODB_API_URL }}
        imdb-ratings-api-base-url: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
        imdb-tapframe-api-base-url: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
        contributions-url: ${{ secrets.CONTRIBUTIONS_URL }}
        donations-base-url: ${{ secrets.DONATIONS_BASE_URL }}
        donations-donate-url: ${{ secrets.DONATIONS_DONATE_URL }}
        premiumize-client-id: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
        sync-backend-manifest-url: ${{ secrets.SYNC_BACKEND_MANIFEST_URL }}

    - name: Compute build version
      id: version
      run: |
        version="1.0.${{ github.run_number }}"
        echo "name=$version" >> $GITHUB_OUTPUT

    # The Kotlin/Native release link of the iOS framework regularly needs
    # 8-10 GB of heap (Compose + Ktor + Supabase). Override at the user level
    # so we don't raise the project default for local developers.
    - name: Raise Gradle heap for Kotlin/Native release link
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.gradle"
        cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
        org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
        kotlin.daemon.jvmargs=-Xmx4g
        org.gradle.parallel=true
        org.gradle.caching=true
        kotlin.native.cacheKind=none
        EOF
        # Stop any stale daemon that might have launched with old heap args.
        ./gradlew --stop || true

    # xcodebuild archive produces a .xcarchive with a deterministic internal
    # layout: Products/Applications/<ProductName>.app — no fragile find needed.
    # -skipPackagePluginValidation and -skipMacroValidation are required because
    # MPVKit is referenced as a local SPM package (XCLocalSwiftPackageReference)
    # and the CI runner has no opportunity to run its plugin validation interactively.
    - name: Archive iOS app (Release, unsigned)
      run: |
        set -euo pipefail
        xcodebuild \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/Nuvio.xcarchive \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          archive

    - name: Repackage .app into unsigned .ipa
      env:
        VERSION: ${{ steps.version.outputs.name }}
      run: |
        set -euo pipefail
        mkdir -p artifacts build/Payload
        app_path="build/Nuvio.xcarchive/Products/Applications/Nuvio.app"
        if [[ ! -d "$app_path" ]]; then
          echo "::error::Built .app not found at $app_path"
          echo "Archive contents:"
          ls -laR build/Nuvio.xcarchive || true
          exit 1
        fi
        cp -R "$app_path" build/Payload/
        ipa_name="NuvioMobile-${VERSION}-ios.ipa"
        (
          cd build
          zip -ry "$ipa_name" Payload > /dev/null
        )
        mv "build/$ipa_name" "artifacts/$ipa_name"
        echo "Packaged IPA: artifacts/$ipa_name"
        ls -la artifacts/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: artifacts/*.ipa
        if-no-files-found: error
        retention-days: 7

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "ios-v${{ steps.version.outputs.name }}"
        name: "iOS Mobile v${{ steps.version.outputs.name }}"
        draft: false
        prerelease: true
        files: artifacts/*.ipa
