name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite
      - feature/dlna-cast
      - dlna-cast
  pull_request:
    branches:
      - cmp-rewrite

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK (Full)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Full Debug APKs
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-debug-full-${{ github.sha }}
          path: |
            androidApp/build/outputs/apk/full/debug/*.apk
            composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
