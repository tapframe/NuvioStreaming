name: Build Test IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full IPA
    runs-on: macos-15
    env:
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned full IPA
        run: ./scripts/build-ios-ipa.sh

      - name: Summarize IPA
        run: |
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
