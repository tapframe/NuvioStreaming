name: Build APK

on:
  push:
    branches: [ feature/advanced-player-features ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize submodules manually
        run: |
          git submodule init MPVKit
          git submodule update --depth=1 MPVKit

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Add Gradle properties
        run: |
          echo "kotlin.native.ignoreDisabledTargets=true" >> gradle.properties
          echo "kotlin.native.enableKlibsCrossCompilation=false" >> gradle.properties

      - name: Build Full Debug APK
        run: ./gradlew :composeApp:assembleFullDebug -x lint -x test --no-configuration-cache

      - name: Rename APK
        run: |
          APK_PATH=$(find composeApp/build/outputs/apk -name "*.apk" | head -1 )
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" composeApp/build/outputs/apk/NuvioMobile-custom-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-APK
          path: composeApp/build/outputs/apk/NuvioMobile-custom-debug.apk
          if-no-files-found: warn

      - name: Upload All APKs (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: All-APKs
          path: composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn
