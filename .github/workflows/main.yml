name: iOS Build

on:
workflow_dispatch:
push:
branches:
- main
- master
- cmp-rewrite
pull_request:

env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: “true”

jobs:
build:
runs-on: macos-15
timeout-minutes: 60

steps:
  - name: Checkout repo without submodules
    uses: actions/checkout@v4
    with:
      submodules: false
  - name: Fix MPVKit dependency
    run: |
      rm -rf MPVKit
      git clone --depth=1 https://github.com/tapframe/MPVNuvio.git MPVKit
      rm -rf MPVKit/.git MPVKit/.gitmodules
  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: zulu
      java-version: "17"
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
  - name: Select Xcode
    run: |
      if [ -d "/Applications/Xcode_16.4.app" ]; then
        sudo xcode-select -s /Applications/Xcode_16.4.app
      else
        sudo xcode-select -s /Applications/Xcode.app
      fi
      xcodebuild -version
  - name: Make Gradle wrapper executable
    run: chmod +x gradlew
  - name: Create empty local properties
    run: touch local.properties
  - name: Clean old build folders
    run: |
      rm -rf iosApp/build
      rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
  - name: Patch iOS signing for unsigned build
    run: |
      ruby -e 'p="iosApp/iosApp.xcodeproj/project.pbxproj"; s=File.read(p); s=s.gsub("CODE_SIGNING_ALLOWED = YES;","CODE_SIGNING_ALLOWED = NO;").gsub("CODE_SIGNING_REQUIRED = YES;","CODE_SIGNING_REQUIRED = NO;").gsub(%q{CODE_SIGN_IDENTITY = "Apple Development";},%q{CODE_SIGN_IDENTITY = "";}).gsub("CODE_SIGN_STYLE = Automatic;","CODE_SIGN_STYLE = Manual;").lines.reject{|l| l.strip.start_with?("DEVELOPMENT_TEAM","PROVISIONING_PROFILE","PROVISIONING_PROFILE_SPECIFIER")}.join; File.write(p,s)'
  - name: Show Xcode project info
    run: |
      cd iosApp
      xcodebuild -list -project iosApp.xcodeproj
  - name: Build app with fixed output folder
    run: |
      set -o pipefail
      cd iosApp
      xcodebuild \
        -project iosApp.xcodeproj \
        -scheme iosApp \
        -configuration Release \
        -derivedDataPath "$PWD/build/DerivedData" \
        SYMROOT="$PWD/build/BuildProducts" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        clean build 2>&1 | tee ../xcodebuild.log
  - name: Package built app
    if: success()
    run: |
      echo "Searching for built .app files..."
      find iosApp/build "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -type d 2>/dev/null || true
      APP_PATH=$(find iosApp/build "$HOME/Library/Developer/Xcode/DerivedData" -name "Nuvio.app" -type d 2>/dev/null | head -n 1)
      if [ -z "$APP_PATH" ]; then
        echo "Nuvio.app not found, trying any available .app file..."
        APP_PATH=$(find iosApp/build "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -type d 2>/dev/null | head -n 1)
      fi
      if [ -z "$APP_PATH" ]; then
        echo "No .app found anywhere"
        echo "Build folder contents:"
        find iosApp/build -maxdepth 8 -type d 2>/dev/null || true
        echo "DerivedData folder contents:"
        find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 8 -type d 2>/dev/null || true
        exit 1
      fi
      echo "Found .app file at: $APP_PATH"
      rm -rf artifacts
      mkdir -p artifacts/Payload
      cp -R "$APP_PATH" "artifacts/Payload/$(basename "$APP_PATH")"
      cd artifacts
      zip -qry Nuvio-unsigned.ipa Payload
  - name: Upload unsigned IPA
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Nuvio-unsigned-IPA
      path: artifacts/Nuvio-unsigned.ipa
  - name: Upload Xcode log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: xcodebuild-log
      path: xcodebuild.log
      if-no-files-found: ignore
