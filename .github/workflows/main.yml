name: iOS Build

on:

  workflow_dispatch:

  push:

    branches:

      - cmp-rewrite

      - main

      - master

  pull_request:

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: Checkout repo without broken recursive submodules

        uses: actions/checkout@v4

        with:

          fetch-depth: 1

          submodules: false

      - name: Clone MPVKit only

        run: |

          rm -rf MPVKit

          git clone --depth=1 https://github.com/tapframe/MPVNuvio.git MPVKit

      - name: Select Xcode

        run: |

          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

      - name: Force simulator build and disable signing

        run: |

          python3 <<'PY'

          from pathlib import Path

          path = Path("iosApp/iosApp.xcodeproj/project.pbxproj")

          text = path.read_text()

          remove_keys = [

              "CODE_SIGNING_ALLOWED",

              "CODE_SIGNING_REQUIRED",

              "CODE_SIGN_IDENTITY",

              "CODE_SIGN_STYLE",

              "DEVELOPMENT_TEAM",

              "PROVISIONING_PROFILE_SPECIFIER",

              "PROVISIONING_PROFILE",

              "CODE_SIGN_ENTITLEMENTS",

              "SDKROOT",

              "SUPPORTED_PLATFORMS",

              "AD_HOC_CODE_SIGNING_ALLOWED",

          ]

          for key in remove_keys:

              import re

              text = re.sub(rf"^\s*{key}\s*=.*;\n", "", text, flags=re.MULTILINE)

          insert = """buildSettings = {

                      CODE_SIGNING_ALLOWED = NO;

                      CODE_SIGNING_REQUIRED = NO;

                      CODE_SIGN_IDENTITY = "";

                      CODE_SIGN_STYLE = Manual;

                      DEVELOPMENT_TEAM = "";

                      PROVISIONING_PROFILE_SPECIFIER = "";

                      PROVISIONING_PROFILE = "";

                      SDKROOT = iphonesimulator;

                      SUPPORTED_PLATFORMS = iphonesimulator;

                      AD_HOC_CODE_SIGNING_ALLOWED = NO;"""

          text = text.replace("buildSettings = {", insert)

          path.write_text(text)

          PY

      - name: Show project files and schemes

        run: |

          echo "Repo root:"

          ls -la

          echo "iosApp folder:"

          ls -la iosApp || true

          echo "Available schemes:"

          cd iosApp

          xcodebuild -list -project iosApp.xcodeproj

      - name: Build iOS app without signing

        run: |

          cd iosApp

          xcodebuild \

            -project iosApp.xcodeproj \

            -scheme iosApp \

            -configuration Debug \

            -sdk iphonesimulator \

            -destination 'generic/platform=iOS Simulator' \

            SDKROOT=iphonesimulator \

            SUPPORTED_PLATFORMS=iphonesimulator \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            CODE_SIGN_IDENTITY="" \

            CODE_SIGN_STYLE=Manual \

            DEVELOPMENT_TEAM="" \

            PROVISIONING_PROFILE_SPECIFIER="" \

            PROVISIONING_PROFILE="" \

            AD_HOC_CODE_SIGNING_ALLOWED=NO \

            clean build
