name: iOS Build

on:

  workflow_dispatch:

  push:

    branches:

      - cmp-rewrite

      - main

      - master

  pull_request:

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: Checkout repo without broken recursive submodules

        uses: actions/checkout@v4

        with:

          fetch-depth: 1

          submodules: false

      - name: Clone MPVKit only

        run: |

          rm -rf MPVKit

          git clone --depth=1 https://github.com/tapframe/MPVNuvio.git MPVKit

      - name: Select Xcode

        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show project files

        run: |

          echo "Repo root:"

          ls -la

          echo "iosApp folder:"

          ls -la iosApp || true

      - name: Build iOS app

        run: |

          cd iosApp

          xcodebuild \

            -project iosApp.xcodeproj \

            -scheme iosApp \

            -configuration Debug \

            -sdk iphonesimulator \

            -destination 'platform=iOS Simulator,name=iPhone 16' \

            CODE_SIGNING_ALLOWED=NO \

            clean build
