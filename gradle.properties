#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M -Xms1024M -XX:MaxMetaspaceSize=2048m -XX:+UseParallelGC
kotlin.native.jvmArgs=-Xmx12288M
kotlin.mpp.enableCInteropCommonization=true
kotlin.build.report.output=file

#Gradle
org.gradle.jvmargs=-Xmx12288M -Xms1024M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
